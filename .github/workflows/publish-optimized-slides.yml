name: Publish quality-gated homepage slide assets
on:
  workflow_dispatch:
  push:
    branches:
      - release/optimized-home-slides-2026-11-28
    paths:
      - 'tools/optimize-home-slides.py'
      - '.github/workflows/publish-optimized-slides.yml'
permissions:
  contents: write
jobs:
  optimize-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/optimized-home-slides-2026-11-28
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate quality-gated WebP files
        run: python tools/optimize-home-slides.py
      - name: Update only homepage slide manifest entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('images/slideshow-manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          home=data.get('home', [])
          if len(home) != 19:
              raise SystemExit(f'Expected 19 homepage slides, found {len(home)}')
          converted=[]
          for item in home:
              name=Path(item).name
              target='/images/optimized-slides/'+Path(name).stem+'.webp'
              if not Path(target.lstrip('/')).is_file():
                  raise SystemExit(f'Missing optimized asset: {target}')
              converted.append(target)
          data['home']=converted
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          print('Updated exactly 19 homepage references; other galleries untouched.')
          PY
      - name: Commit optimized assets and manifest as one change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/optimized-slides/*.webp images/slideshow-manifest.json
          git diff --cached --check
          git commit -m "Optimize 19 homepage slides without changing originals"
          git push origin HEAD:release/optimized-home-slides-2026-11-28

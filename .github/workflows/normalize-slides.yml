name: Normalize NIAZ NET slideshow assets
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - 'hero-slideshow.js'
      - 'site-shell.js'
      - 'tools/normalize-slides.py'
      - '.github/workflows/normalize-slides.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared JavaScript syntax
        run: node --check site-shell.js && node --check hero-slideshow.js
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python tools/normalize-slides.py
      - name: Verify normalization produced no uncommitted changes
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Slideshow normalization changed tracked files. Run the normalizer locally and review the result before committing."
            git status --short
            exit 1
          fi
          echo "All slideshow assets and references already match the canonical format."

name: Normalize NIAZ NET slideshow assets
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - 'hero-slideshow.js'
      - 'site-shell.js'
      - 'tools/normalize-slides.py'
      - '.github/workflows/normalize-slides.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared JavaScript syntax
        run: |
          node --check site-shell.js
          node --check hero-slideshow.js
          node --check language-switcher.js
          node --check fa-translation.js
          node --check fa-translation-runtime.js
          node --check assets/js/api-catalog.js
          node --check assets/js/fcm-cmo-forms.js
          node --check assets/js/fcm-cmo-downloads.js
          node --check newsletter.js
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate normalization in an isolated copy
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          git archive HEAD | tar -x -C "$tmp_dir"
          python "$tmp_dir/tools/normalize-slides.py"
          if [ -n "$(git status --porcelain)" ]; then
            echo "The validation job modified the checked-out repository."
            git status --short
            exit 1
          fi
          echo "Validation completed in an isolated copy; the checked-out repository remains unchanged."

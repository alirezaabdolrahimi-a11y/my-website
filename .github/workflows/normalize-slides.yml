name: Normalize NIAZ NET slideshow assets
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - 'hero-slideshow.js'
      - 'site-shell.js'
      - 'tools/normalize-slides.py'
      - '.github/workflows/normalize-slides.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared JavaScript syntax
        run: node --check site-shell.js && node --check hero-slideshow.js
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python tools/normalize-slides.py
      - name: Commit normalized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "All slideshow assets already use the canonical format."
          else
            git commit -m "Normalize all slideshow artwork to 1944x809"
            git push
          fi

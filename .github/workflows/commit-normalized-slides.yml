name: Commit normalized MASPORT slideshow assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit-normalized-assets:
    if: github.ref == 'refs/heads/fix/sitewide-rebuild-2026-11-21'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected repair-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image normalizer dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Normalize and validate slideshow source
        run: |
          python tools/normalize-slides.py
          python tools/check-site-integrity.py
      - name: Commit only the two missing normalized images and their EN/TR references
        shell: bash
        run: |
          git add -- \
            'images/slides/01 masport.png' \
            'images/slides/02 masport.png' \
            'cosmoderma.html' \
            'tr/cosmoderma.html'
          if git diff --cached --quiet; then
            echo 'No normalized MASPORT asset changes are required.'
            exit 0
          fi
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\\n' \
            'cosmoderma.html' \
            'images/slides/01 masport.png' \
            'images/slides/02 masport.png' \
            'tr/cosmoderma.html' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unexpected changed paths; refusing to commit.'
            printf '%s\\n' "$actual"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: commit normalized MASPORT slideshow images'
          git push origin "HEAD:${GITHUB_REF_NAME}"

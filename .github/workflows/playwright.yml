name: NIAZ NET - Playwright QA

on:
  push:
    branches:
      - main
      - qa/free-agent-followup-2026-11-27
      - rebuild/unified-site-2026-11-27
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run multilingual homepage smoke tests
        run: npm run test:e2e -- --config=playwright.config.js
      - name: Upload Playwright QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niaznet-playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/**/rebuild-*.png
            tests/test-results/**/live-*.png
          if-no-files-found: ignore
          retention-days: 14

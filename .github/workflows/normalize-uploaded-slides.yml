name: Normalize uploaded slideshow canvases on preparation branch
on:
  push:
    branches:
      - prep/sitewide-final-2026-11-23
    paths:
      - 'images/**'
      - 'tools/normalize-slides.py'
permissions:
  contents: write
concurrency:
  group: niaznet-normalize-uploaded-slides
  cancel-in-progress: false
jobs:
  normalize-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prep/sitewide-final-2026-11-23
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Normalize every uploaded slide without cropping or stretching
        run: python tools/normalize-slides.py
      - name: Check shared JavaScript syntax
        run: |
          node --check site-shell.js
          node --check hero-slideshow.js
          node --check language-switcher.js
          node --check fa-translation.js
          node --check fa-translation-runtime.js
          node --check assets/js/api-catalog.js
          node --check assets/js/fcm-cmo-forms.js
          node --check assets/js/fcm-cmo-downloads.js
          node --check assets/js/localized-homepage.js
          node --check assets/js/service-grid.js
          node --check assets/js/homepage.js
          node --check assets/js/homepage-tr.js
          node --check tools/test-locale-precedence.js
      - name: Run full site integrity audit
        run: python tools/check-site-integrity.py
      - name: Commit normalized source canvases if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "No normalized image changes to commit."
          else
            git commit -m "Normalize uploaded slideshow canvases to 1944x809"
            git push origin HEAD:refs/heads/prep/sitewide-final-2026-11-23
          fi

name: NIAZ NET - Semgrep Community SAST

on:
  push:
    branches:
      - main
      - qa/free-agent-followup-2026-11-27
      - fix/seo-technical-gaps-2026-11-28
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Community static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep Community
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan source with Semgrep Registry default rules
        run: semgrep scan --config p/default --severity ERROR --error --metrics=off

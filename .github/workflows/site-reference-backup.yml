name: Temporary NIAZ NET reference backup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-reference-backup.yml"
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website version currently used as the reference
        uses: actions/checkout@v4
        with:
          ref: c0417488ad834b30f77c0f8560d1950afe817dea
      - name: Create full site archive
        run: zip -qr NIAZNET_SITE_REFERENCE_2026-11-20.zip . -x ".git/*"
      - name: Store reference archive
        uses: actions/upload-artifact@v4
        with:
          name: NIAZNET_SITE_REFERENCE_2026-11-20
          path: NIAZNET_SITE_REFERENCE_2026-11-20.zip
          retention-days: 90
